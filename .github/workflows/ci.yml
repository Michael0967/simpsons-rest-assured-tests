name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Los tests de performance golpean una API de terceros y su SLA depende
      # de la latencia del runner compartido. No deben bloquear push/PR;
      # corren en el job `performance` (manual o nightly).
      - name: Run test suite
        run: mvn --batch-mode test -Dtest='!PerformanceApiTest'

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

  performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Umbrales más permisivos que el default local: un runner compartido
      # contra una API pública no garantiza la misma latencia que la máquina local.
      - name: Run performance suite
        run: mvn --batch-mode test -Pperformance -Dperformance.latency.avg.ms=10000 -Dperformance.latency.p95.ms=20000

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-performance
          path: target/allure-results

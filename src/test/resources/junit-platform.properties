# Tags usados por las suites.
# - smoke:      happy path rápido de los 3 recursos
# - regression: cobertura funcional completa
# - contract:   validación de JSON Schema (contratos)
# - performance: tiempos de respuesta y carga concurrente
# - security:   headers, inyección, métodos peligrosos, fuga de info
# - fuzz:       robustez ante entradas aleatorias/extremas
junit.jupiter.tags.show-display-name=true

# Permite que el extension de Allure (allure-junit5) se auto-registre
# como listener vía ServiceLoader.
junit.jupiter.extensions.autodetection.enabled=true

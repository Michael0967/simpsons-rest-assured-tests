# Default test configuration.
# Can be overridden via system property (-Dapi.base.uri=...) or environment
# variable (API_BASE_URI) without touching this file.
api.base.uri=https://thesimpsonsapi.com
api.base.path=/api
api.timeout.connect.ms=10000
api.timeout.read.ms=15000
api.retry.max.attempts=2
api.retry.backoff.ms=500

# Performance / load
performance.warmup.iterations=2
performance.measure.iterations=5
performance.concurrency.threads=10
performance.concurrency.total=30
performance.latency.avg.ms=3000
performance.latency.p95.ms=5000

# Fuzz: random input iterations. Lower to 10 during development;
# raise (e.g. -Dfuzz.iterations=30) for the final validation.
fuzz.iterations=10

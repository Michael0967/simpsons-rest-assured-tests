# Configuración por defecto de las pruebas.
# Se puede sobreescribir por propiedad de sistema (-Dapi.base.uri=...) o
# variable de entorno (API_BASE_URI) sin tocar este archivo.
api.base.uri=https://thesimpsonsapi.com
api.base.path=/api
api.timeout.connect.ms=10000
api.timeout.read.ms=15000
api.retry.max.attempts=2
api.retry.backoff.ms=500

# Performance / carga
performance.warmup.iterations=2
performance.measure.iterations=5
performance.concurrency.threads=10
performance.concurrency.total=30
performance.latency.avg.ms=3000
performance.latency.p95.ms=5000

# Fuzz: iteraciones de entradas aleatorias. Bajar a 10 durante desarrollo;
# subir (ej. -Dfuzz.iterations=30) para la validación final.
fuzz.iterations=10
